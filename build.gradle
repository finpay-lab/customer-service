plugins {
    id 'com.finpay.spring-conventions'
    id 'com.finpay.testing-conventions'
    // The platform spring-conventions plugin deliberately does NOT apply
    // org.springframework.boot (precompiled-plugin classloading quirk in the
    // composite build, see finpay-platform build-logic). Services apply it
    // inline with an explicit version from the catalog.
    alias(libs.plugins.spring.boot)
}

description = 'FinPay customer-service.'

// Services are bootable applications.
bootJar {
    enabled = true
}
jar {
    enabled = true
}

dependencies {
    implementation libs.spring.boot.starter.web
    implementation libs.spring.kafka
    implementation libs.common.web
}

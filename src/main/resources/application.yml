server:
  port: 8080

spring:
  application:
    name: customer-service
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/customer_service}
    username: ${CUSTOMER_DB_USER:customer}
    password: ${CUSTOMER_DB_PASSWORD:customer}
  jpa:
    # Schema is owned by Flyway (ADR-0005); Hibernate never generates DDL.
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

finpay:
  kafka:
    topic:
      customer: ${CUSTOMER_TOPIC:finpay.customer}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

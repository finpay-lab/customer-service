server:
  port: 8084
spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/finpay_customer
    username: finpay
    password: finpay
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: customer-explainer

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      service: customer-service

finpay:
  customer:
    opensearch:
      uris: http://10.8.0.1:9200
    llm:
      byok-secret-ref: ai-key
      timeout-seconds: 20
      index: finpay-customer-events
